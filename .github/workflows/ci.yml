name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHORTENER_IMAGE: observable-url-shortener-shortener:ci-${{ github.sha }}
      RESOLVER_IMAGE: observable-url-shortener-resolver:ci-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/shortener/requirements.txt
            services/resolver/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Run Ruff checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate Terraform without cloud credentials
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Build production images
        run: |
          docker build --tag "$SHORTENER_IMAGE" services/shortener
          docker build --tag "$RESOLVER_IMAGE" services/resolver

      - name: Inspect production images
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$SHORTENER_IMAGE")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$RESOLVER_IMAGE")" = "linux/amd64"
          docker image inspect --format '{{json .Config.Cmd}}' "$SHORTENER_IMAGE" | grep -F 'shortener.main:app'
          docker image inspect --format '{{json .Config.Cmd}}' "$RESOLVER_IMAGE" | grep -F 'resolver.main:app'
          docker run --rm --entrypoint python "$SHORTENER_IMAGE" -c \
            "import aiohttp; from azure.identity.aio import DefaultAzureCredential; from azure.cosmos.aio import CosmosClient; import shortener.main"
          docker run --rm --entrypoint python "$RESOLVER_IMAGE" -c \
            "import aiohttp; from azure.identity.aio import DefaultAzureCredential; from azure.cosmos.aio import CosmosClient; import resolver.main"

      - name: Start local stack
        run: docker compose up --detach --build --wait --wait-timeout 60

      - name: Run real Compose smoke validation
        run: python scripts/smoke.py

      - name: Capture Compose diagnostics
        if: failure()
        run: docker compose logs --no-color shortener resolver otel-collector

      - name: Stop local stack
        if: always()
        run: docker compose down --remove-orphans

      - name: Package deployable images
        run: |
          mkdir -p artifacts
          docker save --output artifacts/shortener-image.tar "$SHORTENER_IMAGE"
          docker save --output artifacts/resolver-image.tar "$RESOLVER_IMAGE"
          (
            cd artifacts
            sha256sum shortener-image.tar resolver-image.tar > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "python_version=$(python --version 2>&1)"
            echo "terraform_version=$(terraform version -json | python -c 'import json,sys; print(json.load(sys.stdin)[\"terraform_version\"])')"
            echo "shortener_image=${SHORTENER_IMAGE}"
            echo "resolver_image=${RESOLVER_IMAGE}"
          } > artifacts/BUILD_INFO.txt
          test -s artifacts/shortener-image.tar
          test -s artifacts/resolver-image.tar
          test -s artifacts/SHA256SUMS.txt
          test -s artifacts/BUILD_INFO.txt

      - name: Upload deployable image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: observable-url-shortener-images-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
